name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [ self-hosted, large ]
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Configure bazel
        run: |
          echo "${{ secrets.BUILDBUDDY_BAZELRC }}" > .bazelrc.user
            echo "build --compilation_mode=opt" > .bazelrc.user
      - name: Set up Docker Context for Buildx
        id: buildx-context
        run: docker context create builders || true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'
      - name: Setup Skaffold CLI
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 &&
            sudo install skaffold /usr/local/bin/ &&
            rm skaffold
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.27.2
      - name: Build and push
        run: skaffold build --profile prod --file-output skaffold.json --default-repo ghcr.io/brainhivenl/support --push
      - uses: actions/upload-artifact@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: skaffold
          path: skaffold.json
